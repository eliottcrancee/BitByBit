<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="BitByBit logo: a half-adder (XOR sum, AND carry) inside a chip package">
  <!-- pins -->
  <g fill="#9ca3af">
    <rect x="36" y="72" width="28" height="12" rx="2"/>
    <rect x="36" y="100" width="28" height="12" rx="2"/>
    <rect x="36" y="128" width="28" height="12" rx="2"/>
    <rect x="36" y="156" width="28" height="12" rx="2"/>
    <rect x="36" y="184" width="28" height="12" rx="2"/>
    <rect x="192" y="72" width="28" height="12" rx="2"/>
    <rect x="192" y="100" width="28" height="12" rx="2"/>
    <rect x="192" y="128" width="28" height="12" rx="2"/>
    <rect x="192" y="156" width="28" height="12" rx="2"/>
    <rect x="192" y="184" width="28" height="12" rx="2"/>
    <rect x="72" y="36" width="12" height="28" rx="2"/>
    <rect x="100" y="36" width="12" height="28" rx="2"/>
    <rect x="128" y="36" width="12" height="28" rx="2"/>
    <rect x="156" y="36" width="12" height="28" rx="2"/>
    <rect x="184" y="36" width="12" height="28" rx="2"/>
    <rect x="72" y="192" width="12" height="28" rx="2"/>
    <rect x="100" y="192" width="12" height="28" rx="2"/>
    <rect x="128" y="192" width="12" height="28" rx="2"/>
    <rect x="156" y="192" width="12" height="28" rx="2"/>
    <rect x="184" y="192" width="12" height="28" rx="2"/>
  </g>
  <!-- package -->
  <rect x="58" y="58" width="140" height="140" rx="18" fill="#111827" stroke="#f59e0b" stroke-width="6"/>
  <!-- half-adder wiring -->
  <g stroke="#f59e0b" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- A rail (top) + fan-out down to the AND gate -->
    <path d="M58 94 H112"/>
    <path d="M92 94 V144"/>
    <!-- B rail (bottom) + fan-out up to the XOR gate -->
    <path d="M58 160 H112"/>
    <path d="M84 160 V110"/>
    <!-- stubs into the gates -->
    <path d="M84 110 H112"/>
    <path d="M92 144 H112"/>
    <!-- outputs to the right edge -->
    <path d="M148 102 H198"/>
    <path d="M143 151 H198"/>
  </g>
  <!-- fan-out junctions -->
  <g fill="#fbbf24">
    <circle cx="92" cy="94" r="4"/>
    <circle cx="92" cy="144" r="4"/>
    <circle cx="84" cy="160" r="4"/>
    <circle cx="84" cy="110" r="4"/>
  </g>
  <!-- XOR gate (sum): curved face, pointed output -->
  <path d="M112 88 C126 88 136 94 148 102 C136 110 126 116 112 116 C117 107 117 97 112 88 Z"
        fill="none" stroke="#fbbf24" stroke-width="4" stroke-linejoin="round"/>
  <path d="M104 88 C112 97 112 107 104 116"
        fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <!-- AND gate (carry): flat face, round back -->
  <path d="M112 136 H128 A15 15 0 0 1 128 166 H112 Z"
        fill="none" stroke="#fbbf24" stroke-width="4" stroke-linejoin="round"/>
  <!-- net labels -->
  <g font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">
    <text x="66" y="86" fill="#fbbf24">A</text>
    <text x="66" y="178" fill="#fbbf24">B</text>
    <text x="190" y="94" fill="#fbbf24">S</text>
    <text x="190" y="143" fill="#fbbf24">C</text>
  </g>
  <!-- bits in, byte out -->
  <g fill="#e5e7eb" font-family="ui-monospace, monospace" font-size="17" text-anchor="middle">
    <text x="20" y="100">1</text>
    <text x="20" y="166">0</text>
    <text x="236" y="108">1</text>
    <text x="236" y="158">0</text>
  </g>
</svg>
